services:
  hive:
    build:
      context: .
    environment:
      HIVE_API_TOKEN: ${HIVE_API_TOKEN:?Set HIVE_API_TOKEN in your environment}
      HIVE_API_ADDR: 0.0.0.0:8000
      HIVE_SSH_ADDR: 0.0.0.0:2222
      HIVE_HTTP_ADDR: 0.0.0.0:8080
      HIVE_MYSQL_ADDR: 0.0.0.0:3306
      HIVE_REDIS_ADDR: 0.0.0.0:6379
      HIVE_RETENTION_DAYS: ${HIVE_RETENTION_DAYS:-30}
      HIVE_EVENT_LOG: /app/data/events.jsonl
    working_dir: /app/data
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3306:3306"
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8000:8000"
    volumes:
      - hive-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on: [hive]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped

volumes:
  hive-data:
